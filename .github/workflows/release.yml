name: Release

# Publishing is tag-driven: land the version commit, then push a `v<version>`
# tag. The workflow refuses a tag that does not match package.json, runs the
# host matrix, and attaches the built tarball to a GitHub Release — that
# tarball is what `dsh plugin add` installs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Release builds deliberately carry no dependency cache.
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Gate: never publish a tag the host matrix has not passed.
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
