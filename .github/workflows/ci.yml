name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19', '24']
        exclude:
          # One Node version per non-Linux host keeps the matrix affordable;
          # the full 22.19 line still runs on Linux.
          - os: macos-latest
            node: '22.19'
          - os: windows-latest
            node: '22.19'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips the package's own prepare build; the test
      # command builds explicitly through its pretest step.
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run typecheck
      - run: npm test
